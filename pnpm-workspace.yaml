packages:
    - apps/*
    - packages/*

catalogMode: prefer

catalog:
    '@hono/node-server': ^2.1.6
    '@hono/swagger-ui': ^0.6.2
    '@hono/zod-openapi': ^1.6.3
    '@tailwindcss/vite': ^4.3.5
    '@types/node': ^26.6.6
    '@types/pg': ^8.23.1
    '@types/react': ^19.3.0
    '@types/react-dom': ^19.3.0
    class-variance-authority: ^0.7.1
    cn: ^0.5.2
    drizzle-kit: ^0.31.11
    drizzle-orm: ^0.45.4
    hono: ^4.13.17
    isbot: ^5.2.2
    lucide-react: ^1.70.0
    pg: ^8.23.1
    radix-ui: ^1.8.1
    react: ^19.3.1
    react-dom: ^19.3.1
    shadcn: ^4.23.0
    tailwindcss: ^4.3.5
    tw-animate-css: ^1.4.0
    typescript: ^7.0.2
    vite: npm:@voidzero-dev/vite-plus-core@1.5.1
    vite-plus: 1.5.1
    zod: ^4.6.7
overrides:
    vite@*: 'catalog:'
    # Keep one Vitest copy, matching the version bundled with vite-plus (`vp toolchain vitest`).
    vitest@*: 5.1.0
peerDependencyRules:
    allowAny:
        - vite
    allowedVersions:
        vite: '*'
minimumReleaseAgeExclude:
    - '@voidzero-dev/vite-plus-core@1.5.1'
    - '@voidzero-dev/vite-plus-darwin-arm64@1.5.1'
    - '@voidzero-dev/vite-plus-darwin-x64@1.5.1'
    - '@voidzero-dev/vite-plus-linux-arm64-gnu@1.5.1'
    - '@voidzero-dev/vite-plus-linux-arm64-musl@1.5.1'
    - '@voidzero-dev/vite-plus-linux-x64-gnu@1.5.1'
    - '@voidzero-dev/vite-plus-linux-x64-musl@1.5.1'
    - '@voidzero-dev/vite-plus-win32-arm64-msvc@1.5.1'
    - '@voidzero-dev/vite-plus-win32-x64-msvc@1.5.1'
    - vite-plus@1.5.1
allowBuilds:
    esbuild: true
