name: CI

on:
    push:
        branches: [master]
    pull_request:

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    check:
        name: Check, test, build
        runs-on: ubuntu-latest
        services:
            postgres:
                image: postgres:18-alpine
                env:
                    POSTGRES_USER: pesoprint
                    POSTGRES_PASSWORD: pesoprint
                    POSTGRES_DB: pesoprint_test
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U pesoprint -d pesoprint_test"
                    --health-interval 2s
                    --health-timeout 5s
                    --health-retries 15
        env:
            TEST_DATABASE_URL: postgres://pesoprint:pesoprint@localhost:5432/pesoprint_test
        steps:
            - uses: actions/checkout@v7.0.1

            - uses: voidzero-dev/setup-vp@v1.22.0
              with:
                  node-version-file: .node-version
                  cache: true

            # React Router route types must exist before type-checking the web app.
            - run: vp run --filter @app/web typegen
            - run: vp check
            - run: vp run -r test
            - run: vp run -r build

    docker:
        name: Docker image (${{ matrix.app }})
        needs: check
        runs-on: ubuntu-latest
        strategy:
            matrix:
                app: [api, web]
        steps:
            - uses: actions/checkout@v7.0.1
            - uses: docker/setup-buildx-action@v4.4.1
            - uses: docker/build-push-action@v7.4.0
              with:
                  context: .
                  file: apps/${{ matrix.app }}/Dockerfile
                  push: false
                  tags: pesoprint-${{ matrix.app }}:ci
                  cache-from: type=gha,scope=${{ matrix.app }}
                  cache-to: type=gha,mode=max,scope=${{ matrix.app }}
