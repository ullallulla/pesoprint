# Local development services. Start with `vp run db:up`, stop with `vp run db:down`.
services:
    postgres:
        image: postgres:18-alpine
        environment:
            POSTGRES_USER: pesoprint
            POSTGRES_PASSWORD: pesoprint
            POSTGRES_DB: pesoprint
        ports:
            - '5432:5432'
        volumes:
            - postgres-data:/var/lib/postgresql
            - ./docker/postgres/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U pesoprint -d pesoprint']
            interval: 2s
            timeout: 5s
            retries: 15

volumes:
    postgres-data:
