<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>The Locomotive Works — Pesoprint first viewport sketch</title>
        <link
            href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&family=Source+Sans+3:wght@500;700&display=swap"
            rel="stylesheet"
        />
        <style>
            :root {
                --plate: #121212;
                --lake: #7a1e24;
                --brass: #c69c3c;
                --straw: #e3c25b;
                --steel: #2b2f2e;
                --enamel: #eef0ea;
            }
            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }
            html,
            body {
                width: 1440px;
                height: 900px;
                overflow: hidden;
            }
            body {
                background: var(--plate);
                color: var(--enamel);
                font-family: 'Source Sans 3', sans-serif;
                position: relative;
            }
            .rivets {
                background-image: radial-gradient(circle at 50% 50%, #3a3a3a 0 4px, transparent 5px);
                background-size: 28px 28px;
            }
            nav {
                height: 72px;
                display: flex;
                align-items: center;
                gap: 34px;
                padding: 0 40px;
                border-bottom: 6px solid var(--brass);
                font: 800 20px 'Big Shoulders Display';
                letter-spacing: 0.12em;
                text-transform: uppercase;
            }
            nav .mark {
                font: 900 32px 'Big Shoulders Display';
                color: var(--brass);
                letter-spacing: 0.06em;
            }
            nav .sp {
                flex: 1;
            }
            .rivetrow {
                position: absolute;
                left: 0;
                right: 0;
                height: 28px;
            }
            .panel {
                position: absolute;
                left: 40px;
                top: 104px;
                width: 1360px;
                height: 640px;
                background: var(--lake);
                border: 6px solid var(--brass);
            }
            .lining {
                position: absolute;
                inset: 18px;
                border: 10px solid #0b0b0b;
                outline: 3px solid var(--straw);
                outline-offset: -16px;
                box-shadow: inset 0 0 0 3px var(--straw);
                pointer-events: none;
            }
            h1 {
                position: absolute;
                left: 80px;
                top: 64px;
                width: 660px;
                font: 900 84px/0.92 'Big Shoulders Display';
                text-transform: uppercase;
                letter-spacing: 0.01em;
                color: var(--enamel);
            }
            h1 span {
                color: var(--straw);
            }
            .levers {
                position: absolute;
                left: 80px;
                top: 410px;
                display: flex;
                gap: 18px;
            }
            .lever {
                width: 200px;
                height: 96px;
                background: var(--brass);
                color: #1a1306;
                border: 4px solid #7a5c1c;
                border-radius: 48px 48px 8px 8px;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                font: 900 34px/1 'Big Shoulders Display';
                text-transform: uppercase;
            }
            .lever small {
                font: 700 14px 'Source Sans 3';
                letter-spacing: 0.14em;
            }
            .lever.on {
                background: repeating-linear-gradient(135deg, #b3241d 0 18px, #121212 18px 36px);
                color: var(--enamel);
                border-color: var(--enamel);
            }
            .search {
                position: absolute;
                left: 80px;
                top: 530px;
                width: 636px;
                height: 60px;
                background: var(--enamel);
                color: #121212;
                border: 4px solid var(--brass);
                display: flex;
                align-items: center;
                padding: 0 20px;
                font: 500 20px 'Source Sans 3';
            }
            .machine {
                position: absolute;
                right: 60px;
                top: 40px;
                width: 600px;
                height: 560px;
            }
            .plate {
                position: absolute;
                right: 120px;
                top: 520px;
                width: 300px;
                height: 96px;
                border-radius: 50%;
                background: var(--plate);
                border: 6px solid var(--brass);
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                color: var(--brass);
                font: 900 22px/1.05 'Big Shoulders Display';
                letter-spacing: 0.1em;
                text-transform: uppercase;
            }
            .ground {
                position: absolute;
                left: 0;
                right: 0;
                bottom: 0;
                height: 156px;
            }
            .synthetic {
                position: absolute;
                right: 44px;
                bottom: 20px;
                font: 700 11px 'Source Sans 3';
                letter-spacing: 0.14em;
                text-transform: uppercase;
                color: var(--brass);
                opacity: 0.7;
            }
        </style>
    </head>
    <body>
        <nav>
            <span class="mark">PESOPRINT WORKS</span><span>Models</span><span>Free</span><span>Files</span
            ><span>Print service</span><span class="sp"></span><span>Sign in</span><span>Cart (0)</span>
        </nav>
        <div class="ground rivets"></div>
        <section class="panel">
            <div class="lining"></div>
            <h1>Download it.<br />Buy the file.<br />Or <span>we’ll print it.</span></h1>

                <div class="lever"><small>Free</small>Download</div>
                <div class="lever"><small>Paid</small>File</div>
                <div class="lever on"><small>To order</small>Print</div>
            </div>
            <div class="search" role="search">Search the works: vases, clips, organisers… or Works No.</div>

                <g transform="translate(450,160)">
                    <path

                        stroke="#121212"

                    />
                    <circle cx="60" cy="60" r="16" fill="#121212" />
                </g>
                <!-- porthole with the object -->
                <circle cx="230" cy="230" r="196" fill="#C69C3C" stroke="#121212" stroke-width="4" />
                <g fill="#121212">
                    <circle cx="230" cy="52" r="7" />
                    <circle cx="230" cy="408" r="7" />
                    <circle cx="52" cy="230" r="7" />
                    <circle cx="408" cy="230" r="7" />
                    <circle cx="104" cy="104" r="7" />
                    <circle cx="356" cy="104" r="7" />
                    <circle cx="104" cy="356" r="7" />
                    <circle cx="356" cy="356" r="7" />
                </g>
                <circle cx="230" cy="230" r="160" fill="#1d2b2a" />
                <path
                    d="M205 105 h50 v40 c0 22 75 50 75 130 c0 55 -45 80 -100 80 s-100 -25 -100 -80 c0 -80 75 -108 75 -130z"
                    fill="#3E8E7E"
                />
                <!-- gauges -->
                <g transform="translate(40,420)">
                    <circle r="62" cx="62" cy="62" fill="#EEF0EA" stroke="#C69C3C" stroke-width="10" />
                    <line x1="62" y1="62" x2="100" y2="34" stroke="#B3241D" stroke-width="5" />
                    <circle cx="62" cy="62" r="7" fill="#121212" />
                    <text
                        x="62"
                        y="102"
                        text-anchor="middle"
                        font-family="Big Shoulders Display"
                        font-weight="900"
                        font-size="26"
                        fill="#121212"
                    >
                        €18
                    </text>
                </g>
            </svg>
            <div class="plate">Works No. 014<br />Tikka vase · PETG</div>
        </section>
        <span class="synthetic">Sketch · placeholder object, number &amp; price</span>
    </body>
</html>
